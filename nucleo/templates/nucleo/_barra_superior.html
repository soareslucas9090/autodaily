<header class="barra-topo">
    <a href="{% url 'inicio' %}" class="barra-topo__marca">AutoDaily</a>
    <nav class="barra-topo__nav" aria-label="Principal">
        <a href="{% url 'historico' %}" class="barra-topo__link">Histórico</a>
        <a href="{% url 'relatorios' %}" class="barra-topo__link">Relatórios</a>
        {% if user.papel == 'admin' %}
        <a href="{% url 'membros_lista' %}" class="barra-topo__link">Membros</a>
        <a href="{% url 'categorias_lista' %}" class="barra-topo__link">Categorias</a>
        {% endif %}
        <form method="post" action="{% url 'sair' %}" style="display:inline;margin:0;">
            {% csrf_token %}
            <button type="submit" class="barra-topo__link" style="background:none;border:none;cursor:pointer;font:inherit;padding:0.25rem 0;">Sair</button>
        </form>
    </nav>
    <div class="barra-topo__acoes">
        <form method="post" action="{% url 'caneta' %}" style="margin:0;">
            {% csrf_token %}
            <button
                type="submit"
                class="icone-botao"
                aria-label="Alternar tinta da caneta"
                title="Alternar caneta azul ou preta"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3z"/>
                    <path d="M13.5 6.5l3 3"/>
                </svg>
            </button>
        </form>
        <button type="button" class="icone-botao" id="botao-tema" aria-label="Alternar tema">
            <svg class="icone-sol" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            </svg>
        </button>
    </div>
</header>
