{% extends "nucleo/base.html" %}

{% block titulo %}Início — AutoDaily{% endblock %}

{% block conteudo %}
<main class="mx-auto max-w-lg px-4 py-12">
    <div class="rounded-lg border border-stone-300 bg-stone-50 p-8 shadow-sm">
        <h1 class="mb-4 text-2xl font-semibold text-stone-900">AutoDaily</h1>
        <p class="text-stone-700">
            Olá, <span class="font-medium text-stone-900">{{ user.username }}</span>.
        </p>
        <p class="mt-2 text-stone-700">
            Papel: <span class="font-medium text-stone-900">{{ user.get_papel_display }}</span>
        </p>
        {% if user.papel == 'admin' %}
        <nav class="mt-6 flex flex-wrap gap-3">
            <a
                href="{% url 'membros_lista' %}"
                class="rounded bg-stone-800 px-4 py-2 text-sm font-medium text-stone-50 hover:bg-stone-700"
            >Membros</a>
            <a
                href="{% url 'categorias_lista' %}"
                class="rounded bg-stone-800 px-4 py-2 text-sm font-medium text-stone-50 hover:bg-stone-700"
            >Categorias</a>
        </nav>
        {% endif %}
        <form method="post" action="{% url 'sair' %}" class="mt-8">
            {% csrf_token %}
            <button
                type="submit"
                class="rounded bg-stone-800 px-4 py-2 text-sm font-medium text-stone-50 hover:bg-stone-700 focus:outline-none focus:ring-2 focus:ring-stone-600 focus:ring-offset-2 focus:ring-offset-stone-50"
            >
                Sair
            </button>
        </form>
    </div>
</main>
{% endblock %}
