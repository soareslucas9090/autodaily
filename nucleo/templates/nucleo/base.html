<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block titulo %}AutoDaily{% endblock %}</title>

    <script>

        (function () {

            var chave = 'autodaily-tema';

            var salvo = localStorage.getItem(chave);

            var tema = salvo === 'escuro' ? 'escuro' : 'claro';

            document.documentElement.setAttribute('data-tema', tema);

        })();

    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap" rel="stylesheet">

    <style>

        :root,

        [data-tema="claro"] {

            --parede: #f3efe6;

            --papel: #f7f1e4;

            --tinta-interface: #2a241c;

            --tinta-suave: #5c5348;

            --tinta-muted: #6b6256;

            --borda: #c9bfb0;

            --borda-suave: #ddd4c4;

            --input-fundo: #fffdf8;

            --btn-fundo: #3d352c;

            --btn-fundo-hover: #4a4036;

            --btn-texto: #f7f1e4;

            --sombra-papel: 0 2px 8px rgba(42, 36, 28, 0.08);

            --perigo-borda: #6b3030;

            --perigo-texto: #4a2020;

            --perigo-fundo-hover: rgba(107, 48, 48, 0.08);

            --barra-topo-fundo: #ebe4d6;

            --progresso: #2f5d45;

            --caneta-azul: #1e3a5f;

            --caneta-preta: #1c1915;

        }



        [data-tema="escuro"] {

            --parede: #2a2622;

            --papel: #3a342c;

            --tinta-interface: #e6dcc8;

            --tinta-suave: #b8aea0;

            --tinta-muted: #9a9084;

            --borda: #524a40;

            --borda-suave: #4a433a;

            --input-fundo: #322c26;

            --btn-fundo: #52483e;

            --btn-fundo-hover: #5f554a;

            --btn-texto: #f0e8da;

            --sombra-papel: 0 2px 10px rgba(0, 0, 0, 0.22);

            --perigo-borda: #a86a6a;

            --perigo-texto: #e8c4c4;

            --perigo-fundo-hover: rgba(168, 106, 106, 0.12);

            --barra-topo-fundo: #322c26;

        }



        *,

        *::before,

        *::after {

            box-sizing: border-box;

        }



        body {

            margin: 0;

            min-height: 100vh;

            font-family: 'Newsreader', Georgia, serif;

            background: var(--parede);

            color: var(--tinta-interface);

            line-height: 1.5;

            -webkit-font-smoothing: antialiased;

        }



        body.pagina-entrada {

            --parede: #f3efe6;

            --papel: #f7f1e4;

            --tinta-interface: #2a241c;

            --tinta-suave: #5c5348;

            --tinta-muted: #6b6256;

            --borda: #c9bfb0;

            --borda-suave: #ddd4c4;

            --input-fundo: #fffdf8;

            --btn-fundo: #3d352c;

            --btn-fundo-hover: #4a4036;

            --btn-texto: #f7f1e4;

            --barra-topo-fundo: #ebe4d6;

        }



        a {

            color: inherit;

        }



        .sr-only {

            position: absolute;

            width: 1px;

            height: 1px;

            padding: 0;

            margin: -1px;

            overflow: hidden;

            clip: rect(0, 0, 0, 0);

            white-space: nowrap;

            border: 0;

        }



        .barra-topo {

            display: flex;

            flex-wrap: wrap;

            align-items: center;

            justify-content: space-between;

            gap: 0.75rem 1.25rem;

            padding: 0.75rem 1.25rem;

            background: var(--barra-topo-fundo);

            border-bottom: 1px solid var(--borda-suave);

        }



        .barra-topo__marca {

            font-size: 1.25rem;

            font-weight: 600;

            text-decoration: none;

            letter-spacing: 0.02em;

        }



        .barra-topo__nav {

            display: flex;

            flex-wrap: wrap;

            align-items: center;

            gap: 0.5rem 1rem;

        }



        .barra-topo__link {

            font-size: 0.95rem;

            text-decoration: none;

            padding: 0.25rem 0;

            border-bottom: 1px solid transparent;

        }



        .barra-topo__link:hover,

        .barra-topo__link--ativo {

            border-bottom-color: var(--tinta-interface);

        }



        .barra-topo__acoes {

            display: flex;

            align-items: center;

            gap: 0.35rem;

        }



        .icone-botao {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 2.25rem;

            min-height: 2.25rem;

            padding: 0.35rem;

            border: 1px solid var(--borda);

            border-radius: 4px;

            background: var(--papel);

            color: var(--tinta-interface);

            cursor: pointer;

            font: inherit;

        }



        .icone-botao:hover {

            background: var(--parede);

        }



        .icone-botao svg {

            width: 1.15rem;

            height: 1.15rem;

            fill: none;

            stroke: currentColor;

            stroke-width: 1.75;

            stroke-linecap: round;

            stroke-linejoin: round;

        }



        .pagina {

            margin: 0 auto;

            padding: 2rem 1rem 3rem;

            max-width: 56rem;

        }



        .pagina--mural {

            max-width: 64rem;

        }



        .pagina--estreita {

            max-width: 32rem;

        }



        .pagina-titulo {

            margin: 0 0 1.5rem;

            font-size: 1.65rem;

            font-weight: 600;

        }



        .mural-grade {

            display: grid;

            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));

            gap: 1.25rem;

        }



        @media (max-width: 720px) {

            .mural-grade {

                grid-template-columns: 1fr;

            }

        }



        .card-papel {

            position: relative;

            background: var(--papel);

            border-radius: 6px;

            padding: 1.5rem;

            box-shadow: var(--sombra-papel);

        }



        .card-papel__titulo {

            margin: 0 0 0.75rem;

            font-size: 1.15rem;

            font-weight: 600;

        }



        .insignia-lido {

            position: absolute;

            top: 1rem;

            right: 1rem;

            font-size: 0.65rem;

            font-weight: 600;

            letter-spacing: 0.08em;

            text-transform: uppercase;

            padding: 0.2rem 0.45rem;

            border: 1px solid var(--borda);

            color: var(--tinta-suave);

            background: var(--parede);

        }



        .barra-progresso {

            margin-bottom: 1rem;

            height: 1.5rem;

            width: 100%;

            overflow: hidden;

            border-radius: 3px;

            background: var(--borda-suave);

        }



        .barra-progresso__fill {

            display: flex;

            height: 100%;

            min-width: 0;

            align-items: center;

            justify-content: center;

            font-size: 0.7rem;

            font-weight: 600;

            color: #f7f1e4;

            background: var(--progresso);

        }



        .card-descricao {

            font-family: 'Kalam', cursive;

            font-size: 1.05rem;

            line-height: 1.45;

            white-space: pre-wrap;

            margin: 0;

        }



        .card-descricao--azul {

            color: var(--caneta-azul);

        }



        .card-descricao--preta {

            color: var(--caneta-preta);

        }



        .texto-meta {

            font-size: 0.875rem;

            color: var(--tinta-muted);

            margin: 0.25rem 0 0;

        }



        .texto-categorias {

            font-size: 0.875rem;

            font-weight: 500;

            color: var(--tinta-suave);

            margin: 0.25rem 0 0;

        }



        .bloco-form {

            margin-top: 1rem;

        }



        .campo {

            margin-bottom: 0.75rem;

        }



        .campo label {

            display: block;

            margin-bottom: 0.25rem;

            font-size: 0.875rem;

            color: var(--tinta-suave);

        }



        .input,

        .textarea,

        .select {

            width: 100%;

            padding: 0.5rem 0.65rem;

            font-family: 'Newsreader', Georgia, serif;

            font-size: 1rem;

            color: var(--tinta-interface);

            background: var(--input-fundo);

            border: 1px solid var(--borda);

            border-radius: 4px;

        }



        .textarea {

            resize: vertical;

        }



        .btn {

            display: inline-block;

            padding: 0.5rem 1rem;

            font-family: inherit;

            font-size: 0.875rem;

            font-weight: 500;

            border-radius: 4px;

            border: none;

            cursor: pointer;

            text-decoration: none;

            line-height: 1.4;

        }



        .btn--primario {

            background: var(--btn-fundo);

            color: var(--btn-texto);

        }



        .btn--primario:hover {

            background: var(--btn-fundo-hover);

        }



        .btn--perigo {

            background: transparent;

            border: 1px solid var(--perigo-borda);

            color: var(--perigo-texto);

        }



        .btn--perigo:hover {

            background: var(--perigo-fundo-hover);

        }



        .btn--secundario {

            background: transparent;

            border: 1px solid var(--borda);

            color: var(--tinta-interface);

        }



        .btn--secundario:hover {

            background: var(--parede);

        }



        .lista-ciencia {

            margin-top: 1rem;

            padding-top: 1rem;

            list-style: none;

            padding-left: 0;

        }



        .border-t {

            border-top-width: 1px;

            border-top-style: solid;

        }



        .border-stone-200 {

            border-top-color: var(--borda-suave);

        }



        .lista-ciencia__item {

            display: flex;

            align-items: center;

            gap: 0.5rem;

            font-size: 0.875rem;

            margin-bottom: 0.35rem;

        }



        .lista-ciencia button[type="submit"] {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 2.25rem;

            min-height: 2.25rem;

            padding: 0.25rem;

            border: 1px solid var(--borda);

            border-radius: 50%;

            background: var(--input-fundo);

            cursor: pointer;

            font: inherit;

            color: var(--tinta-interface);

        }



        .lista-ciencia button[type="submit"]:hover {

            background: var(--parede);

        }



        .pino {

            display: block;

            width: 0.85rem;

            height: 0.85rem;

            border-radius: 50%;

            border: 2px solid var(--tinta-muted);

            background: transparent;

        }



        .pino--marcado {

            border-color: var(--progresso);

            background: var(--progresso);

        }



        .pino--somente-leitura {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 2.25rem;

        }



        .painel {

            background: var(--papel);

            border: 1px solid var(--borda);

            border-radius: 6px;

            padding: 1.5rem;

            box-shadow: var(--sombra-papel);

        }



        .grade-filtros {

            display: grid;

            gap: 1rem;

        }



        @media (min-width: 640px) {

            .grade-filtros {

                grid-template-columns: repeat(2, 1fr);

            }



            .grade-filtros--datas {

                grid-column: span 2;

                display: grid;

                grid-template-columns: 1fr 1fr;

                gap: 0.75rem;

            }

        }



        .lista-dividida {

            list-style: none;

            margin: 0;

            padding: 0;

            border: 1px solid var(--borda);

            border-radius: 6px;

            background: var(--papel);

            overflow: hidden;

        }



        .lista-dividida > li {

            padding: 1rem 1.25rem;

            border-bottom: 1px solid var(--borda-suave);

        }



        .lista-dividida > li:last-child {

            border-bottom: none;

        }



        .lista-relatorio {

            list-style: none;

            margin: 0;

            padding: 0;

            border: 1px solid var(--borda);

            border-radius: 6px;

            background: var(--input-fundo);

        }



        .lista-relatorio > li {

            display: flex;

            justify-content: space-between;

            padding: 0.5rem 1rem;

            border-bottom: 1px solid var(--borda-suave);

            color: var(--tinta-interface);

        }



        .lista-relatorio > li:last-child {

            border-bottom: none;

        }



        .paginacao {

            margin-top: 1.5rem;

            display: flex;

            flex-wrap: wrap;

            align-items: center;

            justify-content: center;

            gap: 0.5rem;

        }



        .paginacao__info {

            font-size: 0.875rem;

            color: var(--tinta-suave);

        }



        .secao-titulo {

            margin: 0 0 0.75rem;

            font-size: 1.1rem;

            font-weight: 600;

        }



        .flex-linha {

            display: flex;

            flex-wrap: wrap;

            align-items: flex-start;

            justify-content: space-between;

            gap: 0.75rem;

        }



        .flex-gap {

            display: flex;

            flex-wrap: wrap;

            gap: 0.5rem;

        }



        .entrada-centro {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 1rem;

        }



        .entrada-form {

            width: 100%;

            max-width: 22rem;

        }



        .entrada-form h1 {

            text-align: center;

            margin: 0 0 1.5rem;

            font-size: 1.65rem;

            font-weight: 600;

        }



        .alerta {

            margin-bottom: 1rem;

            padding: 0.65rem 0.75rem;

            font-size: 0.875rem;

            border: 1px solid var(--borda);

            background: var(--borda-suave);

            border-radius: 4px;

        }



        .erro-campo {

            margin-top: 0.25rem;

            font-size: 0.875rem;

            color: var(--perigo-texto);

        }



        .link-voltar {

            font-size: 0.875rem;

            color: var(--tinta-suave);

            text-decoration: underline;

        }



        .mb-8 {

            margin-bottom: 2rem;

        }



        .mt-3 {

            margin-top: 0.75rem;

        }



        .mt-4 {

            margin-top: 1rem;

        }



        .mt-8 {

            margin-top: 2rem;

        }



        .mb-4 {

            margin-bottom: 1rem;

        }



        .font-medium {

            font-weight: 500;

        }



        .texto-vazio {

            color: var(--tinta-suave);

        }

        .pagina form input:not([type="checkbox"]):not([type="hidden"]),

        .pagina form select,

        .pagina form textarea {

            width: 100%;

            padding: 0.5rem 0.65rem;

            font-family: 'Newsreader', Georgia, serif;

            font-size: 1rem;

            color: var(--tinta-interface);

            background: var(--input-fundo);

            border: 1px solid var(--borda);

            border-radius: 4px;

        }

        .pagina form label {

            display: block;

            margin-bottom: 0.25rem;

            font-size: 0.875rem;

            color: var(--tinta-suave);

        }

        .pagina form > div {

            margin-bottom: 0.75rem;

        }

    </style>

    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    {% block extra_head %}{% endblock %}

</head>

<body class="{% block body_class %}{% endblock %}">

    {% if user.is_authenticated %}

    {% include "nucleo/_barra_superior.html" %}

    {% endif %}

    {% block conteudo %}{% endblock %}

    <script>

        (function () {

            var chave = 'autodaily-tema';

            var botao = document.getElementById('botao-tema');

            if (!botao) return;

            function aplicar(tema) {

                document.documentElement.setAttribute('data-tema', tema);

                localStorage.setItem(chave, tema);

                var escuro = tema === 'escuro';

                botao.setAttribute('aria-label', escuro ? 'Usar tema claro' : 'Usar tema escuro');

                botao.setAttribute('title', escuro ? 'Tema claro' : 'Tema escuro');

            }

            botao.addEventListener('click', function () {

                var atual = document.documentElement.getAttribute('data-tema');

                aplicar(atual === 'escuro' ? 'claro' : 'escuro');

            });

            var temaInicial = document.documentElement.getAttribute('data-tema');

            aplicar(temaInicial === 'escuro' ? 'escuro' : 'claro');

        })();

    </script>

</body>

</html>
