{% extends "nucleo/base.html" %}

{% block titulo %}Nova categoria — AutoDaily{% endblock %}

{% block conteudo %}
<main class="pagina pagina--estreita">
    <div class="painel">
        <h1 class="pagina-titulo">Nova categoria</h1>
        <form method="post">
            {% csrf_token %}
            {% for campo in form %}
            <div>
                <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
                {{ campo }}
                {% if campo.errors %}
                <p class="erro-campo">{{ campo.errors|striptags }}</p>
                {% endif %}
            </div>
            {% endfor %}
            <div class="flex-gap mt-4">
                <button type="submit" class="btn btn--primario">Criar</button>
                <a href="{% url 'categorias_lista' %}" class="btn btn--secundario">Cancelar</a>
            </div>
        </form>
    </div>
</main>
{% endblock %}
